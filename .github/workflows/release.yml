name: Release desktop app

# Every push to main that changes the app builds a new version and publishes
# it as a GitHub release. Installed apps find it through latest.json and
# update themselves.

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # major.minor come from tauri.conf.json; the patch number is this workflow's run number.
      - id: v
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - run: npx tauri build ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect release files (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir out
          b=src-tauri/target/universal-apple-darwin/release/bundle
          cp $b/dmg/*.dmg out/
          cp $b/macos/Tiers.app.tar.gz "out/Tiers_${{ needs.version.outputs.version }}_universal.app.tar.gz"
          cp $b/macos/Tiers.app.tar.gz.sig "out/Tiers_${{ needs.version.outputs.version }}_universal.app.tar.gz.sig"
      - name: Collect release files (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Write latest.json
        run: |
          notes=$(git log -1 --format=%s)
          node scripts/updater-manifest.mjs "${{ needs.version.outputs.version }}" release "${{ github.repository }}" "$notes"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.version.outputs.version }}
          cat > notes.md <<NOTES
          $(git log -1 --format=%s)

          **Downloads:** Mac \`Tiers_${v}_universal.dmg\` (Apple Silicon and Intel), Windows \`Tiers_${v}_x64-setup.exe\`.
          Already installed? The app updates itself.
          NOTES
          gh release create "v$v" --target "${{ github.sha }}" --title "Tiers $v" --notes-file notes.md \
            release/*.dmg release/*-setup.exe release/*-setup.exe.sig \
            release/*.app.tar.gz release/*.app.tar.gz.sig release/latest.json
