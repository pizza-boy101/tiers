<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Tiers</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f7f7f5; --panel: #fff; --text: #1f1f1d; --muted: #6f6f69; --line: #e6e6e1; --accent: #1f1f1d; --accent-text: #fff; --danger: #d1373c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --panel: #1f1f1d; --text: #ededea; --muted: #9a9a93; --line: #33332f; --accent: #ededea; --accent-text: #161615; --danger: #ff6b6f; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    main { width: min(380px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; text-align: center; }
    h1 { font-size: 19px; margin: 12px 0 6px; }
    p { color: var(--muted); margin: 0 0 18px; }
    button { width: 100%; height: 42px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin: 14px 0 0; min-height: 1.5em; }
    #status.error { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <img src="icon.svg" alt="" width="44" height="44">
    <h1>Connect Tiers on your computer</h1>
    <p>Sign in with Google here, and the Tiers app on this computer will sync with your account.</p>
    <button id="sign-in" type="button">Sign in with Google</button>
    <p id="status" role="status"></p>
  </main>
  <script src="connect.js"></script>
</body>
</html>
